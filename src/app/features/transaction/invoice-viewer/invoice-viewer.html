<div class="viewer-container">
  <div class="main-canvas">
    
    <!-- Prev -->
    <button 
      class="nav-btn prev" 
      (click)="changePage(activeIndex - 1)" 
      [disabled]="activeIndex === 0">
      ‹
    </button>

    <!-- Document -->
    <div class="document-frame">
      <img 
        [src]="currentPage?.imageUrl" 
        [class.is-blur]="currentPage?.status === 'error'" 
        alt="Invoice"
      />

      @if (currentPage?.status === 'error') {
        <div class="error-overlay">
          <div class="error-content">
            <div class="error-icon">!</div>
            <h3>AI Extraction Failed</h3>
            <p>{{ currentPage?.errorMessage }}</p>
            <button class="retry-btn" (click)="retryPage()">Try Again</button>
          </div>
        </div>
      }
    </div>

    <!-- Next -->
    <button 
      class="nav-btn next" 
      (click)="changePage(activeIndex + 1)" 
      [disabled]="activeIndex === pages.length - 1">
      ›
    </button>

  </div>
<div class="thumbnail-strip">
  @for (page of pages; track page; let i = $index) {
    <div 
      class="thumb-item" 
      [class.active]="i === activeIndex"
      [class.error-border]="page.status === 'error'"
      (click)="changePage(i)"
    >
      <img [src]="page.imageUrl" alt="thumbnail" />

      @if (page.status === 'error') {
        <div class="status-dot">!</div>
      }
    </div>
  }
</div>
</div>
