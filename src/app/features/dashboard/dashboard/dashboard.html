<div class="dashboard-wrapper">



  <main class="main-content">

    <div class="stats-grid">
      <div class="stat-card green-border">
        <p class="label">Tổng số hóa đơn được</p>
        <div class="card-content">
          <div class="value-group">
            <span class="value">{{ invoiceCount }}</span>
            <!-- <span class="badge up">+12%</span> -->
          </div>
          <div class="icon-box blue">
            <mat-icon>description</mat-icon>
          </div>
        </div>
      </div>


      <div class="stat-card blue-border">
        <p class="label">Tổng số tiền hóa đơn</p>
        <div class="card-content">
          <div class="value-group">
            <span class="value">{{ transactionCount }}</span>
            
          </div>
          <div class="icon-box blue">
            <mat-icon>description</mat-icon>
          </div>
        </div>
      </div>

 
      <div class="stat-card yellow-border">
        <p class="label">Tổng số tiền chi tháng này </p>
        <div class="card-content">
          <div class="value-group">
            <span class="value">{{ totalAmount }}</span>
            
          </div>
          <div class="icon-box blue">
            <mat-icon>description</mat-icon>
          </div>
        </div>

      </div>

      <div class="stat-card red danger-border">
        <p class="label">Tổng số hóa đơn bị tải lỗi</p>
        <div class="card-content">
          <div class="value-group">
            <span class="value">{{ totalToday }}</span>
            
          </div>
          <div class="icon-box red">
            <mat-icon>description</mat-icon>
          </div>
        </div>
      </div>
    </div>

    <div class="insights-grid">
    
      <app-spending-chart></app-spending-chart>
      <app-quick-actions></app-quick-actions>
  
    </div>


<app-recent-invoices></app-recent-invoices>



  </main>
</div>
