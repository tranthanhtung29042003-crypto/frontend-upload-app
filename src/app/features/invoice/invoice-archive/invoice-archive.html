<header class="archive-header">
    <div class="title-area">
      <h1>Invoice Archive</h1>
      <p>Manage and review your historical invoices records.</p>
    </div>
    <div class="status-tabs">
      <button (click)="setTab('ALL')" class="tab" [class.active]="currentTab === 'ALL'">All</button>
      <button (click)="setTab('OK')" class="tab" [class.active]="currentTab === 'OK'">OK</button>
      <button (click)="setTab('ERROR')" class="tab"  [class.active]="currentTab === 'ERROR'">ERROR</button>
    </div>
  </header>
