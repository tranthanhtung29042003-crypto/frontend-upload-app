<header class="header-container">
  <div class="search-section">
    <div class="search-wrapper">
      <mat-icon>search</mat-icon>
      <input type="text" placeholder="Search transactions, vendors...">
    </div>
  </div>

  <div class="action-section">
    <button mat-icon-button class="filter-btn">
      <mat-icon>filter_list</mat-icon>
    </button>
    
    <button mat-icon-button class="notification-btn">
      <mat-icon matBadge="1" matBadgeColor="warn" matBadgeSize="small">notifications_none</mat-icon>
    </button>

    <div class="divider"></div>

    <div class="user-profile">
      <div class="user-info">
        <span class="user-name">{{ displayEmail }}</span>
    
      </div>
      
    </div>
  </div>
</header>
